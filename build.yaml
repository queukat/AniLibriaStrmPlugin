# Jellyfin • AniLiberty STRM manifest for JPRM
# (build.yaml should be placed next to the .csproj file)

category: "Metadata"

artifacts: # DLLs that will be included in the ZIP
  - "AniLibertyStrmPlugin.dll"
  - "Polly.dll"
  - "Polly.Core.dll"
  - "Polly.Extensions.Http.dll"
  - "Microsoft.Extensions.Http.Polly.dll"
  - "icon.png"

changelog: |
  AniLiberty STRM 3.0.0.0 — Jellyfin 12
  
  ### Changes
  
  - Fixed intro and outro skips disappearing after repeated library updates.
  - Corrected skip timings now apply to episodes already in your library.
  - Temporary read errors no longer remove saved skip timings.
  
  ### Upgrade Notes
  
  Restart Jellyfin after updating. No settings changes or library regeneration are required.
description: >
  Browse and watch AniLiberty anime in Jellyfin with posters, episode descriptions,
  and intro/outro skipping when timings are available.

guid: "cce0798d-c8b7-4265-b08c-dc9e7bd3fc0f"
name: "AniLiberty STRM Plugin"
overview: >
  Adds the AniLiberty catalog or your favorites to a Jellyfin library using STRM
  links and local metadata. Episodes stream online rather than downloading for offline viewing.
owner: "queukat"

targetAbi: "12.0.0.0"

version: "3.0.0.0"

image: Resources/icon.png
