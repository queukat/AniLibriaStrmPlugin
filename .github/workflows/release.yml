name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved version already recorded in this branch
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  stable-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore locked packages
        run: dotnet restore AniLibertyStrmPlugin.sln --locked-mode

      - name: Verify formatting and analyzers
        run: dotnet format AniLibertyStrmPlugin.sln --verify-no-changes --no-restore

      - name: Verify Jellyfin package pins
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = "10.11.0"
          for project_path in Path(".").glob("**/*.csproj"):
              project = ET.parse(project_path)
              for item in project.findall(".//PackageReference"):
                  include = item.attrib.get("Include", "")
                  if include.startswith("Jellyfin.") and item.attrib.get("Version") != expected:
                      raise SystemExit(f"{project_path}: {include} must be pinned to {expected}")

          for lock_path in Path(".").glob("**/packages.lock.json"):
              lock = json.loads(lock_path.read_text(encoding="utf-8"))
              deps = lock["dependencies"]["net9.0"]
              for name, meta in deps.items():
                  if name.startswith("Jellyfin.") and meta.get("resolved") != expected:
                      raise SystemExit(f"{lock_path}: {name} resolved {meta.get('resolved')}, expected {expected}")
          PY

      - name: Run offline tests
        run: dotnet test AniLibertyStrmPlugin.Tests/AniLibertyStrmPlugin.Tests.csproj -c Release --no-restore --filter "Category!=Integration&FullyQualifiedName!~ManualStrmGenerationTests"

      - name: Validate approved version and release notes
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version = os.environ["REQUESTED_VERSION"]
          branch = os.environ["GITHUB_REF_NAME"]
          lines = {"jellyfin-12": ("3", "12.0.0.0"), "aniLiberty-v2": ("2", "10.11.0.0")}
          if branch not in lines or not re.fullmatch(r"\d+\.\d+\.\d+\.\d+", version):
              raise SystemExit("Select a supported branch and a four-part approved version")
          major, abi = lines[branch]
          if version.split(".")[0] != major:
              raise SystemExit(f"{branch} must use version line {major}.x")
          manifest = Path("build.yaml").read_text(encoding="utf-8")
          for field, expected in (("version", version), ("targetAbi", abi)):
              match = re.search(rf'^{field}:\s*"([^"]+)"\s*$', manifest, re.MULTILINE)
              if not match or match.group(1) != expected:
                  raise SystemExit(f"build.yaml {field} must equal {expected}")
          project = ET.parse("AniLibertyStrmPlugin.csproj")
          for field in ("Version", "AssemblyVersion", "FileVersion", "InformationalVersion"):
              if project.findtext(f".//{field}") != version:
                  raise SystemExit(f"Project {field} must equal {version}")
          notes = Path(".github/release-notes.md").read_text(encoding="utf-8").strip()
          if not notes.startswith(f"AniLiberty STRM {version} — Jellyfin "):
              raise SystemExit("Approved release notes must match the version")
          block = re.search(r"^changelog: \|\n((?:[ \t].*\n|\n)*)", manifest, re.MULTILINE)
          if not block or "\n".join(line[2:] for line in block.group(1).splitlines()).strip() != notes:
              raise SystemExit("build.yaml changelog must match the curated notes")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## v{version} -" not in changelog or notes not in changelog:
              raise SystemExit("CHANGELOG.md must include the approved release")
          # A lower ABI is also eligible on newer servers. Never let its version outrank that line.
          subprocess.run(["git", "fetch", "origin", "gh-pages"], check=True)
          catalog = json.loads(subprocess.check_output(["git", "show", "FETCH_HEAD:plugins/manifest.json"]))
          versions = next(p for p in catalog if p["guid"] == "cce0798d-c8b7-4265-b08c-dc9e7bd3fc0f")["versions"]
          key = lambda value: tuple(map(int, value.split(".")))
          if any(v["version"] == version for v in versions):
              raise SystemExit("Version is already in the catalog")
          same = [v for v in versions if v["targetAbi"] == abi]
          if same and key(version) <= max(key(v["version"]) for v in same):
              raise SystemExit("Version must increase within its ABI line")
          higher = [v for v in versions if key(v["targetAbi"]) > key(abi)]
          for target in {v["targetAbi"] for v in higher}:
              if key(version) >= max(key(v["version"]) for v in higher if v["targetAbi"] == target):
                  raise SystemExit("Publish the newer Jellyfin line before this release")
          tag = f"v{version}"
          if subprocess.run(["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"]).returncode == 0:
              raise SystemExit("Release tag already exists; never overwrite a published version")
          Path(".release_notes_body.md").write_text(notes + "\n", encoding="utf-8")
          Path(".manifest_changelog.txt").write_text(notes + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"NEXT_VERSION={version}\nRELEASE_TAG={tag}\n")
              output.write(f'RELEASE_URL=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/tag/{tag}\n')
          PY

      - name: Build plugin zip
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: net9.0
          version: ${{ env.NEXT_VERSION }}

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          md5sum "${{ steps.jprm.outputs.artifact }}" > "${{ steps.jprm.outputs.artifact }}.md5"
          sha256sum "${{ steps.jprm.outputs.artifact }}" > "${{ steps.jprm.outputs.artifact }}.sha256"

      - name: Create and push verified release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "AniLiberty STRM ${NEXT_VERSION}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AniLiberty STRM ${{ env.NEXT_VERSION }}
          body_path: .release_notes_body.md
          generate_release_notes: false
          make_latest: ${{ github.ref_name == 'jellyfin-12' }}
          files: |
            ${{ steps.jprm.outputs.artifact }}
            ${{ steps.jprm.outputs.artifact }}.md5
            ${{ steps.jprm.outputs.artifact }}.sha256

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install jprm CLI
        run: python -m pip install --quiet "git+https://github.com/oddstr13/jellyfin-plugin-repository-manager@v1.1.1"

      - name: Update manifest/catalog on gh-pages
        shell: bash
        env:
          PLUGIN_GUID: cce0798d-c8b7-4265-b08c-dc9e7bd3fc0f
        run: |
          set -euo pipefail

          WORKSPACE="${GITHUB_WORKSPACE}"
          PAGES_DIR="${WORKSPACE}/gh-pages"
          PLUGINS_DIR="${PAGES_DIR}/plugins"
          mkdir -p "${PLUGINS_DIR}"

          ARTIFACT_PATH="${WORKSPACE}/${{ steps.jprm.outputs.artifact }}"
          MD5_PATH="${WORKSPACE}/${{ steps.jprm.outputs.artifact }}.md5"
          ZIPNAME="$(basename "${ARTIFACT_PATH}")"
          MD5="$(cut -d' ' -f1 "${MD5_PATH}")"

          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/plugins"
          RELEASE_URL="${RELEASE_URL}"
          CHANGELOG_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/CHANGELOG.md"
          MANIFEST_NOTES="$(cat "${WORKSPACE}/.manifest_changelog.txt")"

          cp "${ARTIFACT_PATH}" "${PLUGINS_DIR}/${ZIPNAME}"
          if [ "${GITHUB_REF_NAME}" = "jellyfin-12" ]; then
            cp "${WORKSPACE}/CHANGELOG.md" "${PAGES_DIR}/CHANGELOG.md"
          fi
          mkdir -p "${PLUGINS_DIR}/aniliberty-strm-plugin"
          cp "${WORKSPACE}/Resources/icon.png" "${PLUGINS_DIR}/aniliberty-strm-plugin/icon.png"

          pushd "${PLUGINS_DIR}"
          [ -f manifest.json ] || echo "[]" > manifest.json
          jprm repo add . "./${ZIPNAME}"

          jq \
            --arg guid "${PLUGIN_GUID}" \
            --arg version "${NEXT_VERSION}" \
            --arg sourceUrl "${BASE_URL}/${ZIPNAME}" \
            --arg checksum "${MD5}" \
            --arg notes "${MANIFEST_NOTES}" \
            --arg releaseUrl "${RELEASE_URL}" \
            --arg changelogUrl "${CHANGELOG_URL}" \
            --arg iconUrl "${BASE_URL}/aniliberty-strm-plugin/icon.png" \
            '
            map(
              if (type == "object" and .guid == $guid) then
                (
                  .imageUrl as $img
                  | .imageUrl = (
                      if (($img | type) == "string" and ($img | startswith("http"))) then
                        $img
                      else
                        $iconUrl
                      end
                    )
                  | if (.versions | type) == "array" then
                      .versions |= map(
                        if (type == "object" and .version == $version) then
                          .sourceUrl = $sourceUrl |
                          .checksum = $checksum |
                          .changelog = $notes |
                          .releaseUrl = $releaseUrl |
                          .changelogUrl = $changelogUrl
                        else . end
                      )
                    else
                      .
                    end
                )
              else . end
            )
            ' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          popd

      - name: Commit and push gh-pages changes
        shell: bash
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/manifest.json plugins/*.zip plugins/aniliberty-strm-plugin/icon.png CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit"
          else
            git commit -m "chore(repo): publish ${RELEASE_TAG}"
            if [ -n "${GH_PAGES_TOKEN:-}" ]; then
              git remote set-url origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            fi
            git push origin HEAD:gh-pages
          fi
