name: Feature request
description: Suggest an improvement or a new plugin capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case and the result you would like to see. Please check existing issues before submitting a new request.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Explain what is difficult or impossible with the plugin today.
      placeholder: "Example: I only want to update a small set of ongoing titles without generating the full catalog..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like the plugin to do?
      description: Describe the behavior or workflow you expect to use.
      placeholder: "Example: allow a selected set of titles to be updated independently..."
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?
      description: Describe any current workaround, if one exists.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Add screenshots, examples, links, or other relevant details.
    validations:
      required: false
